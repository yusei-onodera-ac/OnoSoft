name: Release

# タグ形式: <アプリのフォルダー名>-v<バージョン>  (例: ClipboardHistoryManager-v1.0.0)
on:
  push:
    tags:
      - "*-v*.*.*"

# GitHub Release の作成には書き込み権限が必要。
# リポジトリ/組織側のデフォルト設定が読み取り専用の場合に備えて明示する。
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse app name and version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          APP_NAME="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Tag=$TAG -> App=$APP_NAME Version=$VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish (self-contained, single file, win-x64)
        shell: pwsh
        run: |
          dotnet publish "src/${env:APP_NAME}/${env:APP_NAME}.csproj" `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${env:VERSION} `
            -o "publish/${env:APP_NAME}"

      - name: Zip the published output
        shell: pwsh
        run: |
          $zipPath = "${env:APP_NAME}-${env:VERSION}-win-x64.zip"
          Compress-Archive -Path "publish/${env:APP_NAME}/*" -DestinationPath $zipPath
          echo "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV

      # installer/<AppName>.iss がある場合だけ、管理者権限不要のインストーラーもビルドする。
      # 「アプリと機能」から普通にアンインストールでき、同じバージョン情報で再インストールすれば
      # 上書き更新されるため、配布・更新・アンインストールがまとめて簡単になる。
      - name: Build installer with Inno Setup (if present)
        shell: pwsh
        run: |
          $issPath = "installer/${env:APP_NAME}.iss"
          if (-not (Test-Path $issPath)) {
            Write-Output "No installer script for ${env:APP_NAME} — skipping installer build."
            echo "INSTALLER_BUILT=false" >> $env:GITHUB_ENV
            exit 0
          }

          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } else {
            $iscc = $iscc.Source
          }

          $sourceDir = (Resolve-Path "publish/${env:APP_NAME}").Path
          & $iscc $issPath "/DMyAppVersion=${env:VERSION}" "/DSourceDir=$sourceDir"

          $setupExe = Get-ChildItem -Path "installer" -Filter "${env:APP_NAME}-Setup-*.exe" | Select-Object -First 1
          if ($null -eq $setupExe) {
            Write-Error "Installer build did not produce an output file."
            exit 1
          }
          echo "INSTALLER_PATH=$($setupExe.FullName)" >> $env:GITHUB_ENV
          echo "INSTALLER_BUILT=true" >> $env:GITHUB_ENV

      - name: Create GitHub Release (zip only)
        if: env.INSTALLER_BUILT != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ env.APP_NAME }} v${{ env.VERSION }}"
          generate_release_notes: true
          files: ${{ env.ZIP_PATH }}

      - name: Create GitHub Release (zip + installer)
        if: env.INSTALLER_BUILT == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ env.APP_NAME }} v${{ env.VERSION }}"
          generate_release_notes: true
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.INSTALLER_PATH }}
